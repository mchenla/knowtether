name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/build_plugin_hooks.py --check
      - run: python scripts/check_framework.py
      - run: python -m unittest discover -s tests -v
      - run: knowtether --version
      - run: kpdm-hooks --version
